[project]
name = "blender-mcp-local"
version = "1.0.9"
description = "Local-only MCP bridge for Blender (no external services, no telemetry)."
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.27.0,<2", "pydantic>=2.11,<3"]

[project.scripts]
blender-mcp-local = "blender_mcp_local.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp_local"]
